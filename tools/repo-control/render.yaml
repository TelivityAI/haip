# Discord Activity ORIGIN only — not a standalone public product.
# Discord proxies this host into a voice-channel Activity. Do NOT advertise the URL.
# SEPARATE from the public HAIP demo blueprint — do not merge into root render.yaml.
#
# Set secrets in the Render dashboard (never commit):
#   REPO_CONTROL_AUTH_TOKEN, VITE_DISCORD_CLIENT_ID
# Bake/refresh snapshots via build or authenticated POST /api/refresh.

services:
  - type: web
    name: haip-repo-control
    runtime: node
    plan: starter
    rootDir: tools/repo-control
    buildCommand: pnpm install --ignore-workspace && pnpm exec tsx src/analyze.ts --skip-checks && pnpm build:ui
    startCommand: pnpm start

    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: "8787"
      - key: REPO_CONTROL_AUTH_TOKEN
        sync: false
      - key: REPO_CONTROL_DISCORD_PUBLIC_READ
        value: "true"
      - key: REPO_CONTROL_CONFIG
        value: config.haip.yaml
      # Discord Application ID — required for Embedded App SDK inside Activity
      - key: VITE_DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_CLIENT_ID
        sync: false
