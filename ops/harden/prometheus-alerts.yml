groups:
  - name: haip-production
    rules:
      - alert: HaipBookingCreateErrorRate
        expr: |
          sum(rate(haip_booking_create_total{outcome="failed"}[10m]))
          /
          clamp_min(sum(rate(haip_booking_create_total[10m])), 0.001) > 0.05
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: HAIP booking creation error rate is above 5%
          description: Check API errors, inventory locks, payment gateway, and database health.

      - alert: HaipChannelSyncFailed
        expr: increase(haip_channel_sync_total{outcome="failed"}[10m]) > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: HAIP channel synchronization failed
          description: Inventory or rates may be stale on an OTA. Open Channels and retry/reconcile.

      - alert: HaipNightAuditMissing
        expr: haip_night_audit_last_business_date_timestamp_seconds > 0 and (time() - haip_night_audit_last_business_date_timestamp_seconds) > 129600
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: HAIP night audit business date is more than 36 hours old
          description: Verify the audit schedule and complete the missing business date.

      - alert: HaipWebhookDeliveryExhausted
        expr: increase(haip_webhook_delivery_failures_total[10m]) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: A HAIP webhook exhausted all retry attempts
          description: Re-deliver or manually reconcile mandatory downstream integrations.
