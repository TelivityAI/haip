agent:
  id: "4.2"
  name: Property Deduplication Agent
  domain: lodging
  version: "0.2.0"
  status: live
  package: "@otaip/agents-lodging"

description: >
  Identifies duplicate hotel properties across multiple sources and merges them
  into canonical records. Cheap string/geo similarity only builds a shortlist of
  candidate pairs. The final decision is a three-way outcome — same, maybe
  (human review), or different — not a single magic similarity cutoff as merge
  authority. Union-Find still groups transitive same matches.

input:
  type: PropertyDeduplicationInput
  fields:
    - name: properties
      type: RawHotelResult[]
      required: true
      description: Raw hotel results from multiple sources (output of Agent 4.1)
    - name: shortlist
      type: DeduplicationShortlistConfig
      required: false
      description: Override blocking / candidate-generation similarity settings
    - name: source_trust_hierarchy
      type: string[]
      required: false
      description: Ordered list of sources by trust level for content merge decisions

output:
  type: PropertyDeduplicationOutput
  fields:
    - name: canonical_properties
      type: CanonicalProperty[]
      description: Deduplicated properties with merged content (same outcomes only)
    - name: merge_log
      type: MergeRecord[]
      description: Which source records were merged as same and why
    - name: flagged_for_review
      type: PropertyPair[]
      description: >
        Candidate pairs judged maybe — human must decide. Include which fields
        disagree (name, address, geo, chain, stars) to help the curator.
    - name: separated_pairs
      type: PropertyPair[]
      description: Candidate pairs judged different (left unlinked)
    - name: total_input
      type: number
    - name: total_output
      type: number
    - name: dedup_ratio
      type: number
      description: Reduction percentage (e.g., 0.4 means 40% were duplicates)

behavior:
  - "Pipeline: Normalize → Block → Shortlist → Decide (same|maybe|different) → Merge same only"
  - "Shortlist (not final authority): Jaro-Winkler (name), Levenshtein (address), Haversine (coordinates), chain code, star rating — weighted composite only proposes candidate pairs"
  - "Blocking by city + chain code to reduce O(n²) comparisons before shortlist"
  - "Final outcome per candidate pair is three-way: same (merge) | maybe (human queue + field disagreements) | different (leave apart)"
  - "Do NOT auto-merge solely because a string/geo composite exceeds 0.85 — similarity scores propose candidates; semantic sameness decides"
  - "When implemented, the intended final judge is a scored same/maybe/different judgment plus per-field agreement checks (name, address/geo, chain); string/geo scores remain shortlist-only"
  - "Union-Find grouping only over pairs decided same (A same B, B same C → A,B,C merge)"
  - "Content merge uses source trust hierarchy for per-field best-content selection"
  - "Explainable — every same/maybe/different decision records shortlist scores and field-level agreement notes"

errors:
  - AgentNotInitializedError: Called before initialize()
  - AgentInputValidationError: Empty properties array

pipeline:
  upstream: Agent 4.1 (Hotel Search Aggregator)
  downstream: Agent 4.3 (Content Normalization), Agent 4.4 (Rate Comparison)
